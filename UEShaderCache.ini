; UEShaderCache.ini - Unreal Engine shader / PSO caching plugin (Ultimate ASI Loader)
; This file is optional: the plugin writes it with defaults on first run.
[General]
Enabled=1
LogLevel=1
CacheDir=ShaderCache

[D3D12]
PipelineLibrary=1
SaveOnExit=1
SaveIntervalSeconds=60
MaxCacheMB=512

[D3D11]
HintDriverCache=1

[Unreal]
InjectCVars=1
PSOCache=1
PrecompileOnLoad=1
AsyncCompile=1
GCTweaks=1
StreamingTweaks=1
UE5PSOPrecache=1
BackupIni=1

[DirectStorage]
Tune=1
StagingBufferMB=256
DisableGPUDecompression=0
